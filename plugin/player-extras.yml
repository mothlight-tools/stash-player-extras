name: Player Extras
description: Extra controls for the scene player - details-panel button, motion heatmap, previous/next marker buttons and keys, a rating popup, scene info on hover (an ⓘ on each multiscreen screen) and next to the title in Stash UI, a task-queue button, VR zoom, scroll memory and (if you turn it on) full screen when you click the player. Also works on every DirtyMultiscreen screen. Each one can be switched off.
version: 1.5.0
ui:
  javascript:
    - player_extras.js
  assets:
    /: assets
settings:
  enableAutoFullscreen:
    displayName: Full screen when you click the player (scene page and DirtyMultiscreen)
    description: Your first click on the video or its controls makes the page full screen (no tabs, address bar or taskbar), so the buttons at the bottom are easy to reach. It stays on while you move between scenes and ends when you leave the player; Esc leaves it any time. Browsers only allow full screen after a click, so it can't start on its own.
    type: BOOLEAN
  disableTopbarInfo:
    displayName: Turn off studio and performers next to the title (Stash UI top bar)
    type: BOOLEAN
  disablePanelButton:
    displayName: Turn off ☰ details-panel button
    type: BOOLEAN
  disableHeatmap:
    displayName: Turn off motion heatmap
    type: BOOLEAN
  disableMarkerSkip:
    displayName: Turn off « » marker skip (buttons and [ ] keys)
    type: BOOLEAN
  disableRating:
    displayName: Turn off ☆ rating popup
    type: BOOLEAN
  disableQueueButton:
    displayName: Turn off ⚙ task-queue button
    type: BOOLEAN
  disableVrZoom:
    displayName: Turn off VR zoom
    type: BOOLEAN
  disableScrollMemory:
    displayName: Turn off scroll memory
    type: BOOLEAN
  disableMultiscreen:
    displayName: Don't add buttons to DirtyMultiscreen screens
    type: BOOLEAN
